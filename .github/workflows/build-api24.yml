name: Build Android 7 APK

# Builds the Android 7 (API 24) fork of OpenRide for the original Peloton Bike (PLTN-RB1VO).
# Run it from the Actions tab ("Run workflow") or by pushing. The APK is attached to the run
# as the artifact "openride-api24".

on:
  push:
    branches: [main, android7]
  workflow_dispatch:

jobs:
  build:
    # Pinned: ubuntu-latest moved to Ubuntu 26 in Oct 2026; 24.04 ships the Android SDK.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"/platforms "$ANDROID_HOME"/build-tools

      - name: Install Godot ${{ env.GODOT_VERSION }} (exports the mini-games pack)
        run: |
          set -euo pipefail
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          for base in \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"; do
            if curl -fsSL -o /tmp/godot.zip "$base/$zip"; then break; fi
          done
          unzip -q /tmp/godot.zip -d /tmp/godot
          bin="$(ls /tmp/godot/Godot_v*)"
          chmod +x "$bin"
          echo "GODOT_BIN=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Lint for APIs newer than Android 7 (NewApi)
        continue-on-error: true
        run: ./gradlew :app:lintDebugReal

      - name: Unit tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest

      - name: Report lint and test problems as annotations
        if: always()
        id: report
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/reports/lint-results-debugReal.xml"):
              issues = ET.parse(f).getroot().findall("issue")
              newapi = [i for i in issues if i.get("id") in ("NewApi", "InlinedApi", "ObsoleteSdkInt")]
              errors = [i for i in issues if i.get("severity") in ("Error", "Fatal")]
              print(f"::notice::lint: {len(issues)} issues, {len(errors)} errors, {len(newapi)} API-level")
              for i in (newapi + [e for e in errors if e not in newapi])[:15]:
                  loc = i.find("location")
                  where = f"{loc.get('file','?').split('/app/')[-1]}:{loc.get('line','?')}" if loc is not None else "?"
                  print(f"::warning::lint {i.get('id')} {where} {i.get('message')[:200]}")
          failed = 0
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  bad = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
                  if bad is not None:
                      failed += 1
                      if failed <= 15:
                          msg = (bad.get("message") or bad.text or "")[:200].replace("\n", " ")
                          print(f"::warning::test {tc.get('classname')}.{tc.get('name')}: {msg}")
          print(f"::notice::unit tests: {failed} failed")
          # A NewApi hit is a call that crashes on Android 7, so it blocks the build.
          import sys
          hard = 0
          for f in glob.glob("app/build/reports/lint-results-debugReal.xml"):
              hard = sum(1 for i in ET.parse(f).getroot().findall("issue") if i.get("id") == "NewApi")
          if hard:
              print(f"::error::{hard} NewApi lint hits: calls that need a newer Android than 7")
          sys.exit(1 if hard or failed else 0)
          PY

      - name: Build APK
        run: ./gradlew :app:assembleDebugReal

      - name: Check the APK targets Android 7
        run: |
          apk="$(ls app/build/outputs/apk/debugReal/*.apk)"
          aapt="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$aapt" dump badging "$apk" | grep -E "^package:|sdkVersion|native-code"
          cp "$apk" "openride-api24-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: openride-api24
          path: openride-api24-*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-and-test-reports
          path: |
            app/build/reports/lint-results-debugReal.html
            app/build/reports/tests/
          if-no-files-found: ignore
